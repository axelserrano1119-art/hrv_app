name: hrv_app
description: "A Flutter HRV and heart-rate measurement application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0-148.0.dev

dependencies:
  flutter:
    sdk: flutter

  # UI / Icons
  cupertino_icons: ^1.0.8

  # Camera / PPG
  camera: ^0.12.0+1

  # Charts
  fl_chart: ^1.2.0

  # File / Local Storage
  path_provider: ^2.1.5

  # Firebase
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0

  # Security / Authentication Storage
  flutter_secure_storage: ^9.2.4
  encrypt: ^5.0.3

  # Date / Time Formatting
  intl: ^0.20.2

  # Mathematical / Signal Processing
  vector_math: ^2.1.4

  # Linting
  flutter_lints: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true